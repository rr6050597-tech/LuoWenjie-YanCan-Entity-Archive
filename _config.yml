# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: 罗文杰炎灿 | Roma Luo
lang: zh-CN
email: luoyancan6@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  罗文杰炎灿（Roma Luo）官方网站：模特、演员、作家、炎灿香氛主理人。著作《兔儿神》系列与《罗文杰讲高岛易断》《罗文杰讲药师经》等，在线阅读与听书。
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://luowenjie.art" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
github_username: rr6050597-tech

# Build settings
# theme: minima
remote_theme: jeffreytse/jekyll-theme-yat
theme_color: "#F7F5F0"
brand_color: "#C5A059"
header_pages:
  - works/film.md
  - works/ads.md
  - works/magazine.md
  - gallery.md
  - books.md
  - readings.md
  - bio.md
  - faq.md
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-sitemap

night_mode: manual

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key will not be processed.
#
# To learn more about this exclusion, see:
# https://jekyllrb.com/docs/configuration/#exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .git/

# ② rl_nav：新菜单的数据源（分组只能写在这里，header_pages 本身是平铺列表，无法分组）
rl_nav:
  groups:
    - num: "01"
      title: 时尚与演艺
      children:
        - { title: 影视, url: /works/film/ }
        - { title: 广告, url: /works/ads/ }
        - { title: 杂志, url: /works/magazine/ }
        - { title: 图集, url: /gallery/ }

    - num: "02"
      title: 文学与出版
      children:
        - { title: 书籍, url: /books/ }
        - { title: 诵读, url: /readings/ }

    # 03：目前没有独立页面，先直达首页上已有的两本书详情页（URL 来自首页链接）。
    # 以后新增《讲萨满》《讲显化》等页面，往 children 里加一行即可。
    - num: "03"
      title: 东方哲学
      children:
        - { title: 高岛易断, url: /books/gaodao-yiduan/ }
        - { title: 药师经, url: /books/yaoshijing/ }

    # 04：直达首页的香氛区块（现有锚点 #fragrance），没有子项，所以不展开。
    - num: "04"
      title: 炎灿香氛
      url: /#fragrance

  # 次要入口：抽屉底部 / 电脑端顶栏右侧
  footer:
    - { title: 简介, url: /bio/ }
    - { title: 常见问题, url: /faq/ }

  # 语言按钮：顶栏左上角，始终可见
  languages:
    - { code: zh-CN, label: 中文 }
    - { code: en, label: EN }
    - { code: ja, label: 日本語 }
    - { code: es, label: ES }
