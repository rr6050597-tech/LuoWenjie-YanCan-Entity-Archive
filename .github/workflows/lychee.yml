name: Links
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --accept 200,204,206,202,429 --base-url https://luowenjie.art --exclude-path '_includes/**' --exclude-path '_layouts/**' --exclude 'baike\.baidu\.com' --exclude 'cineuropa\.org' --exclude 'zhihu\.com' --exclude 'rabbitgod\.cn' './**/*.md' './**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
