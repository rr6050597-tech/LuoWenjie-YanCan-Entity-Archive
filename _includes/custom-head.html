</script>

<style>
  #yc-toc { display: none; }
  @media (min-width: 1100px) {
    #yc-toc {
      display: block; position: fixed; right: 24px; top: 120px; width: 220px;
      max-height: 70vh; overflow: auto; font-size: 13px; line-height: 1.7;
      border-left: 2px solid #C5A059; padding-left: 14px;
    }
    #yc-toc .toc-list { list-style: none; padding-left: 0; margin: 0; }
    #yc-toc .toc-list .toc-list { padding-left: 12px; }
    #yc-toc .toc-link { color: #8a8578; text-decoration: none; }
    #yc-toc .is-active-link { color: #2C2C2C; font-weight: 600; }
  }
</style>
<script>
  (function() {
    if (!/\/books\/[^/]+\/read\//.test(window.location.pathname)) return;
    function loadCss(href) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = href;
      document.head.appendChild(l);
    }
    function loadJs(src, cb) {
      var s = document.createElement('script');
      s.src = src; s.onload = cb;
      document.head.appendChild(s);
    }
    function initToc() {
      if (!window.tocbot) return;
      var page = document.querySelector('.read-page');
      if (!page) return;
      var toc = document.createElement('nav');
      toc.id = 'yc-toc';
      toc.setAttribute('aria-label', '本页目录');
      page.parentNode.insertBefore(toc, page);
      tocbot.init({
        tocSelector: '#yc-toc',
        contentSelector: '.read-page',
        headingSelector: 'h2, h3, h4',
        hasInnerContainers: true
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      loadCss('https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.css');
      loadJs('https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.min.js', initToc);
    });
  })();
</script>

<!-- 2026-11-27 Dior 式滚动动效：区块进入视口时淡入 + 轻微上移（原生 IntersectionObserver，无动画库、无插件） -->
<style>
  .yc-reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease-out, transform .7s ease-out; will-change: opacity, transform; }
  .yc-reveal.yc-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .yc-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!("IntersectionObserver" in window)) return;
    var targets = document.querySelectorAll(".hero-full, .manifesto, .home-sec, .sys-card, .work-card, .book-card, .tl-item, .prod, .biz-card, .home-foot, .books-grid, .books-list li, .book-covers figure, .book-detail h1, .book-detail h2, .book-desc, .book-meta, .bio-page h2, .bio-page p");
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) { e.target.classList.add("yc-visible"); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    targets.forEach(function(el) { el.classList.add("yc-reveal"); io.observe(el); });
  });
</script>

     所以以后新增书籍详情页、新增图片都会自动生效。

<style id="yc-motion2-css">
/* 起始态：只有 JS 给元素加了 .yc-m 才会生效；JS 不跑 → 一切照常可见 */

  --yc-e:cubic-bezier(.22,.61,.36,1);          /* 接近现有 ease-out，尾部更柔 */
  opacity:0;
  transform:translate3d(0,var(--yc-dy),0) scale(var(--yc-s));
  transition:opacity var(--yc-t) var(--yc-e),transform var(--yc-t) var(--yc-e);
}
/* 分层：卡片只升不缩（文字保持锐利）；图片带一点「落定」缩放，且只从 <1 缩到 1，不会撑出横向滚动条 */
html .yc-m[data-yc="book"] {--yc-dy:20px;--yc-s:1;   --yc-t:.8s}
html .yc-m[data-yc="cover"]{--yc-dy:24px;--yc-s:.96; --yc-t:.9s}
html .yc-m[data-yc="photo"]{--yc-dy:14px;--yc-s:.985;--yc-t:.7s}
html .yc-m.yc-in{opacity:1;transform:none}
html .yc-m.yc-run{will-change:opacity,transform}   /* 仅在动画进行中存在，结束即摘 */

@media (prefers-reduced-motion:reduce){html .yc-m{opacity:1!important;transform:none!important;transition:none!important}}
@media print{html .yc-m{opacity:1!important;transform:none!important}}
</style>

<script id="yc-motion2-js">

  var BOOK=/^\/books\/[^\/]+$/, mode;

  var CAP   ={book:4,  photo:5,  cover:0};   // 最多错峰几档（快速滑动时不会越排越晚）

    requestAnimationFrame(function(){el.classList.add('yc-in');});

     接近现有 Observer（.12 / -40px），但对很高的图更宽容 */

    "bio-link":{zh:"完整履历 →",en:"Full Biography →",ja:"全経歴を見る →",es:"Biografía completa →"},
    "bio-h1":{zh:"罗文杰（炎灿）个人简介",en:"Roma Luo (Yan Can) — Personal Profile",ja:"罗文杰（炎灿）プロフィール",es:"Roma Luo (Yan Can) — Perfil Personal"},
    "bio-p-1":{zh:"罗文杰，笔名炎灿，1993年11月13日生于黑龙江省虎林市，身高188厘米，现居深圳、广州与温哥华。跨界文化创业者、作家、前国际超模。",en:"Roma Luo, pen name Yan Can, was born on 13 November 1993 in Hulin, Heilongjiang, China. He is 188 cm tall and now lives in Shenzhen, Guangzhou and Vancouver. A cross-disciplinary cultural entrepreneur, writer, and former international supermodel.",ja:"罗文杰、ペンネームは炎灿。1993年11月13日、中国黒竜江省虎林市生まれ、身長188cm。現在は深圳、広州、バンクーバーを拠点に活動する、多領域で活躍する文化起業家、作家、元インターナショナル・トップモデル。",es:"Roma Luo, con seudónimo Yan Can, nació el 13 de noviembre de 1993 en Hulin, Heilongjiang, China. Mide 188 cm de altura y actualmente vive en Shenzhen, Cantón y Vancouver. Emprendedor cultural interdisciplinario, escritor y antiguo supermodelo internacional."},
    "bio-sec-1":{zh:"时尚与演艺生涯",en:"Fashion & Performing Arts",ja:"ファッション・芸能キャリア",es:"Moda y Artes Escénicas"},
    "bio-p-2":{zh:"2012年签约龙腾精英，入选MDC全球模特榜单NEW FACE。2013年4月担任DIOR HOMME中国北京首秀开场模特，曾为VERSACE及中国国际时装周走秀，登上 GQ、时尚先生、时尚芭莎，代言三星、速写、AGATHA 等品牌。2015年主演电影《地下香》（永乐），影片入围第72届威尼斯电影节“威尼斯日”单元，获该单元Fedeora最佳影片奖。",en:"In 2012 he signed with Longteng Elite and was named MDC NEW FACE. In April 2013 he opened the DIOR HOMME debut show in Beijing, China, and went on to walk for VERSACE and China Fashion Week, appearing in GQ, Esquire and Harper's Bazaar, and fronting campaigns for Samsung, SUXI and AGATHA, among other brands. In 2015 he starred as Yong Le in the film Underground Fragrance, which was selected for the Venice Days section of the 72nd Venice International Film Festival and won the section's Fedeora Best Film award.",ja:"2012年に龙腾精英と契約し、MDCのグローバルモデルランキング「NEW FACE」に選出される。2013年4月、DIOR HOMMEの中国・北京初ショーでオープニングモデルを務め、VERSACEや中国国際ファッションウィークのランウェイに登場。GQ、时尚先生、时尚芭莎などの雑誌を飾り、三星、速写、AGATHAなど数々のブランドの顔となった。2015年には映画《地下香》で永楽役として主演した。同作は第72回ヴェネチア国際映画祭「ヴェネチア・デイズ」部門に選出され、同部門のFedeora最優秀作品賞を受賞した。",es:"En 2012 firmó con Longteng Elite y fue nombrado MDC NEW FACE. En abril de 2013 abrió el desfile debut de DIOR HOMME en Pekín, China, y desfiló para VERSACE y la Semana de la Moda de China. Ha aparecido en GQ, Esquire y Harper's Bazaar, además de protagonizar campañas para Samsung, SUXI y AGATHA, entre otras marcas. En 2015 protagonizó el papel de Yong Le en la película Underground Fragrance, seleccionada para la sección Venice Days del 72.° Festival Internacional de Cine de Venecia, donde ganó el premio Fedeora a la mejor película de dicha sección."},
    "bio-sec-2":{zh:"商业构建与品牌运营",en:"Business & Brand Building",ja:"ビジネス構築とブランド運営",es:"Negocios y Desarrollo de Marca"},
    "bio-p-3":{zh:"2018年6月创立哈尔滨莱亚文化传媒。2026年创立东方文化与香氛品牌“炎灿”，推出兔儿神香囊、否极泰来香囊。",en:"In June 2018 he founded Harbin Laiya Culture Media. In 2026 he founded Yan Can, an Oriental culture and fragrance brand, launching the Rabbit God sachet and the Fortune Turns sachet.",ja:"2018年6月、哈尔滨莱亚文化传媒を創業。2026年には東洋文化とフレグランスのブランド「炎灿」を立ち上げ、兔儿神サシェ、「否極泰来」サシェを発表。",es:"En junio de 2018 fundó Harbin Laiya Culture Media. En 2026 fundó Yan Can, una marca de cultura oriental y fragancias, lanzando el saquito aromático del Dios Conejo y el saquito aromático de la Buena Fortuna."},
    "bio-sec-3":{zh:"文学创作与文化数字保育",en:"Writing & Digital Cultural Preservation",ja:"文学創作と文化的デジタル保存",es:"Creación Literaria y Conservación Cultural Digital"},
    "bio-p-4":{zh:"著有《兔儿神》与《兔儿神2》，已在海外及数字阅读平台出版。创办独立文化档案网站，主理《兔儿神日历》。毕业于不列颠哥伦比亚大学（UBC）哲学系，获学士学位。",en:"He is the author of The Rabbit God and The Rabbit God 2, published overseas and on digital reading platforms. He founded an independent cultural archive website and curates the Rabbit God Calendar. He holds a bachelor's degree in philosophy from the University of British Columbia (UBC).",ja:"著書に《兔儿神》《兔儿神2》があり、海外およびデジタル読書プラットフォームで刊行されている。独立系文化アーカイブサイトを創設し、《兔儿神日历》を主宰している。ブリティッシュコロンビア大学（UBC）哲学科を卒業し、学士号を取得した。",es:"Es autor de El Dios Conejo y El Dios Conejo 2, publicados en el extranjero y en plataformas de lectura digital. Fundó un sitio web de archivo cultural independiente y dirige el Calendario del Dios Conejo. Es licenciado en Filosofía por la Universidad de la Columbia Británica (UBC)."},
    "bio-sec-4":{zh:"玄学研习与生活美学",en:"Metaphysics & the Art of Living",ja:"玄学の研鑽と生活美学",es:"Estudio de la Metafísica y Estética de la Vida"},
    "bio-p-5":{zh:"研习中国传统玄学与古典哲学，擅长八字、六爻、相面、风水、先天八卦与《高岛易断》。承鸠摩罗什译经文风，尚侘寂之美，精通芳香疗法。",en:"He studies traditional Chinese metaphysics and classical philosophy, specialising in BaZi, Liu Yao (Six Lines), physiognomy, Feng Shui, the Xiantian Bagua and the Takashima Ekidan (《高岛易断》). His prose follows the translation style of Kumarajiva; he cherishes the beauty of wabi-sabi and is skilled in aromatherapy.",ja:"中国の伝統玄学と古典哲学を研鑽し、八字、六爻、人相、風水、先天八卦、《高岛易断》を得意とする。鳩摩羅什の経典翻訳の文体を受け継ぎ、侘び寂びの美を尊び、アロマセラピーに精通している。",es:"Estudia la metafísica tradicional china y la filosofía clásica, especializado en BaZi, Liu Yao (Seis Líneas), fisonomía, Feng Shui, el Xiantian Bagua y el Takashima Ekidan (《高岛易断》). Su prosa sigue el estilo de traducción de Kumarajiva; valora la belleza del wabi-sabi y es experto en aromaterapia."},

    "film-p-underground":{zh:"2015年，罗文杰跨界大银幕，在影片《地下香》中担纲男主角，饰演“永乐”一角；该片入围第72届威尼斯电影节“威尼斯日”单元，并获该单元 Fedeora 最佳影片奖（奖项属于影片）。",en:"In 2015, Roma Luo crossed over to the big screen, taking the male lead as Yong Le in Underground Fragrance. The film was selected for the Venice Days section of the 72nd Venice International Film Festival and won the section's Fedeora Best Film award (the award belongs to the film).",ja:"2015年、罗文杰は映画界に進出し、《地下香》で永乐役として主演を務めた。同作は第72回ヴェネチア国際映画祭「ヴェネチア・デイズ」部門に選出され、同部門のFedeora最優秀作品賞を受賞した（賞は映画作品のものです）。",es:"En 2015, Roma Luo dio el salto a la gran pantalla interpretando al protagonista Yong Le en la película Underground Fragrance. La cinta fue seleccionada para la sección Venice Days del 72.° Festival Internacional de Cine de Venecia y ganó el premio Fedeora a la mejor película de la sección (el premio pertenece a la película)."},
    "film-video-cap":{zh:"2016 年第 18 届台北电影节官方预告",en:"Official trailer, 18th Taipei Film Festival, 2016",ja:"2016年 第18回台北映画祭公式予告編",es:"Tráiler oficial, 18.° Festival de Cine de Taipéi, 2016"},
    "film-meta":{zh:"2015 年，DCP，彩色，75 分钟，法国 / 中国。导演鹏飞，罗文杰饰演北漂青年永乐。影片入围第 72 届威尼斯电影节“威尼斯日”单元，并获该单元 Fedeora 最佳影片奖（奖项属于影片），并获 2015 年芝加哥国际电影节金雨果最佳影片奖，入围釜山影展。",en:"2015. DCP, colour, 75 min, France / China. Directed by Peng Fei; Roma Luo plays Yong Le, a young drifter in Beijing. The film was selected for the Venice Days section of the 72nd Venice International Film Festival and won the section's Fedeora Best Film award (the award belongs to the film), won the Gold Hugo for Best Film at the 2015 Chicago International Film Festival, and was selected for the Busan International Film Festival.",ja:"2015年、DCP、カラー、75分、フランス / 中国。監督は鹏飞、罗文杰は北漂の青年・永乐を演じた。同作は第72回ヴェネチア国際映画祭「ヴェネチア・デイズ」部門に選出され、同部門のFedeora最優秀作品賞を受賞し（賞は映画作品のものです）、2015年シカゴ国際映画祭で金雨果最優秀作品賞を受賞、釜山国際映画祭にも出品された。",es:"2015. DCP, color, 75 min, Francia / China. Dirigida por Peng Fei; Roma Luo interpreta a Yong Le, un joven vagabundo en Pekín. La película fue seleccionada para la sección Venice Days del 72.° Festival Internacional de Cine de Venecia y ganó el premio Fedeora a la mejor película de la sección (el premio pertenece a la película), obtuvo el Hugo de Oro a la mejor película en el Festival Internacional de Cine de Chicago de 2015 y fue seleccionada para el Festival Internacional de Cine de Busan."},
    "film-h2-talkshow":{zh:"《今晚80后脱口秀》",en:"Tonight's Post-80s Talk Show",ja:"《今晚80后脱口秀》",es:"《今晚80后脱口秀》"},
    "film-p-talkshow":{zh:"罗文杰曾参与《今晚80后脱口秀》。",en:"Roma Luo appeared on Tonight's Post-80s Talk Show.",ja:"罗文杰は《今晚80后脱口秀》に出演した。",es:"Roma Luo apareció en Tonight's Post-80s Talk Show."},

    "film-cap-photocall":{zh:"2015年威尼斯电影节拍照环节",en:"Photocall, Venice Film Festival 2015",ja:"2015年ヴェネチア国際映画祭 フォトコール",es:"Sesión fotográfica, Festival de Cine de Venecia 2015"},

  var HTML_KEYS={"home-manifesto":1,"sys-3-desc":1};
  function ycGetLang(){try{return localStorage.getItem('yc-lang')||'zh';}catch(e){return 'zh';}}
  function ycApplyLang(lang){
    document.documentElement.setAttribute('data-yc-lang',lang);
    document.documentElement.lang=lang==='zh'?'zh-CN':lang;
    var els=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<els.length;i++){
      var k=els[i].getAttribute('data-i18n');
      var v=DICT[k]&&DICT[k][lang];
      if(v==null)continue;
      if(HTML_KEYS[k]){els[i].innerHTML=v;}else{els[i].textContent=v;}
    }
    var bts=document.querySelectorAll('[data-book-title]');
    for(var t=0;t<bts.length;t++){
      var bel=bts[t];
      if(!bel.getAttribute('data-title-zh')){bel.setAttribute('data-title-zh',bel.textContent);}
      var bzh=bel.getAttribute('data-title-zh');
      var bv=lang==='zh'?bzh:(bel.getAttribute('data-title-'+lang)||bzh);
      bel.textContent=bv;
    }
    var bh1=document.querySelector('.book-detail h1[data-book-title]');
    var ben=document.querySelector('.book-detail .book-en');
    if(bh1&&ben){ben.style.display=(ben.textContent.trim()===bh1.textContent.trim())?'none':'';}
    var phs=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<phs.length;j++){
      var k2=phs[j].getAttribute('data-i18n-ph');
      var v2=DICT[k2]&&DICT[k2][lang];
      if(v2!=null)phs[j].setAttribute('placeholder',v2);
    }
    var btns=document.querySelectorAll('[data-yc-lang-btn]');
    for(var b=0;b<btns.length;b++){btns[b].setAttribute('aria-pressed',btns[b].getAttribute('data-yc-lang-btn')===lang?'true':'false');}
    try{localStorage.setItem('yc-lang',lang);}catch(e){}
  }
  function ycSetLang(lang){if(LANGS.indexOf(lang)<0)return;ycApplyLang(lang);}
  window.ycSetLang=ycSetLang;
  function ycBuildSwitcher(extraCls){
    var wrap=document.createElement('div');
    wrap.className='yc-lang-switch'+(extraCls?' '+extraCls:'');
    wrap.setAttribute('role','group');
    wrap.setAttribute('aria-label','Language / 语言 / 言語 / Idioma');
    LANGS.forEach(function(l){
      var btn=document.createElement('button');
      btn.type='button';
      btn.setAttribute('data-yc-lang-btn',l);
      btn.setAttribute('aria-pressed','false');
      btn.textContent=LABELS[l];
      btn.addEventListener('click',function(){ycSetLang(l);});
      wrap.appendChild(btn);
    });
    return wrap;
  }
  function ycBuildLangDropdown(){
    var wrap=document.createElement('div');
    wrap.className='yc-lang-dropdown';
    var btn=document.createElement('button');
    btn.type='button';
    btn.className='yc-lang-dropbtn';
    btn.setAttribute('aria-haspopup','true');
    btn.setAttribute('aria-expanded','false');
    var lbl=document.createElement('span');
    lbl.textContent='语言';
    var caret=document.createElement('span');
    caret.className='yc-lang-caret';
    caret.setAttribute('aria-hidden','true');
    caret.textContent='▾';
    btn.appendChild(lbl);
    btn.appendChild(caret);
    var menu=document.createElement('div');
    menu.className='yc-lang-menu';
    menu.setAttribute('role','menu');
    LANGS.forEach(function(l){
      var b=document.createElement('button');
      b.type='button';
      b.className='yc-lang-opt';
      b.setAttribute('data-yc-lang-btn',l);
      b.setAttribute('aria-pressed','false');
      b.setAttribute('role','menuitem');
      b.textContent=LABELS[l];
      b.addEventListener('click',function(){ycSetLang(l);closeDrop();});
      menu.appendChild(b);
    });
    function closeDrop(){wrap.classList.remove('open');btn.setAttribute('aria-expanded','false');}
    btn.addEventListener('click',function(e){e.stopPropagation();var open=wrap.classList.toggle('open');btn.setAttribute('aria-expanded',open?'true':'false');});
    document.addEventListener('click',function(e){if(!wrap.contains(e.target))closeDrop();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrop();});
    wrap.appendChild(btn);
    wrap.appendChild(menu);
    return wrap;
  }
  document.addEventListener('DOMContentLoaded',function(){
    var headerInner=document.querySelector('.site-header-inner');
    var langDrop=ycBuildLangDropdown();
    if(headerInner){headerInner.insertBefore(langDrop,headerInner.firstChild);}
    else{var tg=document.querySelector('.theme-toggle');if(tg&&tg.parentNode){tg.parentNode.insertBefore(langDrop,tg);}}
    var btn=document.createElement('button');
    btn.className='yc-menu-btn';
    btn.type='button';
    btn.setAttribute('aria-label','目录 Menu');
    var burger=document.createElement('span');
    burger.className='yc-burger';
    burger.setAttribute('aria-hidden','true');
    for(var bi=0;bi<3;bi++){burger.appendChild(document.createElement('i'));}
    btn.appendChild(burger);
    var backdrop=document.createElement('div');
    backdrop.className='yc-menu-backdrop';
    var panel=document.createElement('nav');
    panel.className='yc-menu-panel';
    panel.setAttribute('aria-label','目录');
    var closeRow=document.createElement('div');
    closeRow.className='yc-menu-close';
    var closeBtn=document.createElement('button');
    closeBtn.type='button';
    closeBtn.setAttribute('aria-label','关闭 Close');
    closeBtn.textContent='×';
    closeRow.appendChild(closeBtn);
    panel.appendChild(closeRow);
    panel.appendChild(ycBuildSwitcher('yc-lang-panel'));
    var items=[['/','nav-home'],['/books/','nav-books'],['/works/film/','nav-film'],['/works/ads/','nav-ads'],['/works/magazine/','nav-magazine'],['/gallery/','nav-gallery'],['/bio/','nav-bio'],['/faq/','nav-faq'],['/#fragrance','nav-fragrance']];
    items.forEach(function(it){
      var a=document.createElement('a');
      a.className='yc-menu-item';
      a.href=it[0];
      var sp=document.createElement('span');
      sp.setAttribute('data-i18n',it[1]);
      a.appendChild(sp);
      a.addEventListener('click',function(){closeMenu();});
      panel.appendChild(a);
    });
    function openMenu(){panel.classList.add('open');backdrop.classList.add('open');document.body.style.overflow='hidden';}
    function closeMenu(){panel.classList.remove('open');backdrop.classList.remove('open');document.body.style.overflow='';}
    btn.addEventListener('click',function(){if(panel.classList.contains('open')){closeMenu();}else{openMenu();}});
    closeBtn.addEventListener('click',closeMenu);
    backdrop.addEventListener('click',closeMenu);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
    function placeMenuBtn(){
      var header=document.querySelector('.site-header')||document.querySelector('header');
      var toggle=document.querySelector('.theme-toggle');
      var bottom=64;
      if(header){bottom=Math.max(bottom,Math.round(header.getBoundingClientRect().bottom));}
      if(toggle){bottom=Math.max(bottom,Math.round(toggle.getBoundingClientRect().bottom));}
      btn.style.top=(bottom+12)+'px';
    }
    placeMenuBtn();
    window.addEventListener('resize',placeMenuBtn);
    window.addEventListener('orientationchange',placeMenuBtn);
    document.body.appendChild(btn);
    document.body.appendChild(backdrop);
    document.body.appendChild(panel);
    ycApplyLang(ycGetLang());
  });
})();
</script>

<!-- ═════════ RL NAV · 悬浮玻璃顶栏 + 四大体系抽屉（2026-11-28，语言接 ycSetLang；2026-11-28 修订：明暗开关拿掉，品牌常显居中，语言面板同步选中态，旧悬浮元素一律隐藏） ═════════ -->
<!-- ═════════ RL NAV · 悬浮玻璃顶栏 + 四大体系抽屉 ═════════
     追加到 _includes/custom-head.html 末尾。自包含，所有类名以 rl- 开头，不影响其他样式。
     数据来自 _config.yml 的 rl_nav。JS 不可用或出错时，自动回退到原顶栏。 -->
<style id="rl-nav-css">
:root{
  --rl-paper:#F7F5F0; --rl-ink:#2C2C2C; --rl-gold:#C5A059;
  --rl-pad-left:1cm;                 /* 抽屉左侧留白，约 1cm */
  --rl-gap:12px;                     /* 顶栏离屏幕左右边缘 */
  --rl-h:52px;                       /* 顶栏高度 */
  --rl-top:calc(env(safe-area-inset-top,0px) + 10px);
  --rl-serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  --rl-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --rl-ease:cubic-bezier(.2,.7,.2,1);
}

/* 旧顶栏：只在新导航成功生成后才隐藏。
   ⚠ 把下面的选择器换成你现有顶栏的真实类名（浏览器里长按/右键「检查」可看到）。 */
html.rl-on .site-header,
html.rl-on header.site-header{display:none!important}
/* 旧的悬浮菜单按钮不在顶栏里，藏顶栏藏不掉它，一并藏掉（旧语言下拉在顶栏内部，跟着顶栏走，不用管） */
html.rl-on .yc-menu-btn,
html.rl-on .yc-menu-backdrop,
html.rl-on .yc-menu-panel,
html.rl-on .theme-toggle,
html.rl-on .yc-lang-dropdown{display:none!important}

/* 非首页：给悬浮顶栏让出位置；首页不让，大图直接铺到顶栏下面 */
html.rl-on:not(.rl-home) body::before{content:"";display:block;height:calc(var(--rl-top) + var(--rl-h) + 14px)}
html.rl-on{scroll-padding-top:calc(var(--rl-top) + var(--rl-h) + 16px)}

.rl-nav,.rl-nav *{box-sizing:border-box}
.rl-nav{font-family:var(--rl-sans);color:var(--rl-ink);-webkit-tap-highlight-color:transparent}
.rl-nav a{color:inherit;text-decoration:none}
.rl-nav button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.rl-nav ul{list-style:none;margin:0;padding:0}
.rl-nav :focus-visible{outline:1.5px solid var(--rl-gold);outline-offset:2px}

/* ── Liquid Glass 材质（顶栏 / 语言面板 / 抽屉 / 电脑端下拉共用）── */
.rl-glass{
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),rgba(247,245,240,.70);
  -webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 10px 32px rgba(44,44,44,.14),inset 0 1px 0 rgba(255,255,255,.75);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .rl-glass{background:rgba(247,245,240,.96)}
}
.rl-scrolled .rl-bar{background-color:rgba(247,245,240,.86)}

/* ── 顶栏 ── */
.rl-bar{
  position:fixed;z-index:9992;top:var(--rl-top);left:var(--rl-gap);right:var(--rl-gap);
  max-width:1080px;margin:0 auto;height:var(--rl-h);border-radius:26px;
  display:flex;align-items:center;justify-content:space-between;padding:0 6px;transition:background-color .3s;
}
.rl-lang-btn{height:40px;padding:0 14px 0 12px;border-radius:20px;display:flex;align-items:center;gap:7px;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.rl-lang-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3}
.rl-brand{position:absolute;left:50%;transform:translateX(-50%);z-index:1;font-family:var(--rl-serif);font-size:15px;letter-spacing:.32em;text-indent:.32em;white-space:nowrap}

.rl-burger{width:40px;height:40px;border-radius:20px;position:relative;flex:none}
.rl-burger i{position:absolute;left:11px;right:11px;height:1.5px;border-radius:1px;background:currentColor;transition:transform .35s var(--rl-ease),top .35s var(--rl-ease)}
.rl-burger i:nth-child(1){top:16px}
.rl-burger i:nth-child(2){top:23px}
.rl-open .rl-burger i:nth-child(1){top:19.5px;transform:rotate(45deg)}
.rl-open .rl-burger i:nth-child(2){top:19.5px;transform:rotate(-45deg)}
.rl-lang-btn:hover,.rl-burger:hover{background:rgba(44,44,44,.06)}

/* ── 语言面板（始终从左上角按钮下方展开）── */
.rl-pop{
  position:fixed;z-index:9993;top:calc(var(--rl-top) + var(--rl-h) + 8px);
  left:max(var(--rl-gap),calc((100vw - 1080px)/2 + 4px));
  min-width:132px;padding:8px;border-radius:20px;
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;
  transition:opacity .22s,transform .3s var(--rl-ease),visibility 0s .3s;
}
.rl-pop.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.rl-pop button{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;padding:11px 14px;border-radius:12px;font-size:14px;letter-spacing:.04em}
.rl-pop button:hover{background:rgba(44,44,44,.06)}
.rl-pop button[aria-checked="true"]::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--rl-gold)}

/* ── 手机端抽屉：窄卡片，宽度刚好包住文字，左侧留白约 1cm ── */
.rl-scrim{position:fixed;inset:0;z-index:9990;background:rgba(44,44,44,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
.rl-open .rl-scrim{opacity:1;visibility:visible;transition-delay:0s}
.rl-drawer{
  position:fixed;z-index:9993;top:calc(var(--rl-top) + var(--rl-h) + 8px);right:var(--rl-gap);
  width:max-content;min-width:11em;max-width:calc(100vw - 2*var(--rl-gap));
  max-height:calc(100vh - var(--rl-top) - var(--rl-h) - 24px);
  max-height:calc(100dvh - var(--rl-top) - var(--rl-h) - 24px);
  overflow:auto;overscroll-behavior:contain;border-radius:24px;
  padding:10px 24px 10px var(--rl-pad-left);
  opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transform-origin:top right;
  transition:opacity .22s,transform .32s var(--rl-ease),visibility 0s .32s;
}
.rl-open .rl-drawer{opacity:1;visibility:visible;transform:none;transition-delay:0s}

.rl-g>button,.rl-g>a{display:flex;align-items:baseline;gap:12px;width:100%;padding:13px 0;font-family:var(--rl-serif);font-size:17px;letter-spacing:.12em;white-space:nowrap}
.rl-n{min-width:16px;font-family:var(--rl-sans);font-size:10.5px;letter-spacing:.08em;color:var(--rl-gold);font-variant-numeric:tabular-nums}
/* 手风琴：grid 行高 0fr → 1fr，无需 JS 量高度 */
.rl-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s var(--rl-ease)}
.rl-sub>ul{min-height:0;overflow:hidden;padding-left:28px;visibility:hidden;transition:visibility 0s .34s}
.rl-g.on>.rl-sub{grid-template-rows:1fr}
.rl-g.on>.rl-sub>ul{visibility:visible;transition-delay:0s}
.rl-sub a{display:block;padding:8px 0;font-size:14.5px;letter-spacing:.08em;color:rgba(44,44,44,.72);white-space:nowrap}
.rl-sub li:last-child a{margin-bottom:10px}
.rl-hr{height:1px;margin:6px 0 4px;background:linear-gradient(90deg,rgba(197,160,89,.55),rgba(197,160,89,0))}
.rl-foot a{display:block;padding:9px 0 9px 28px;font-size:14px;letter-spacing:.1em;color:rgba(44,44,44,.62);white-space:nowrap}
.rl-nav a[aria-current="page"]{color:var(--rl-gold)}

/* ── 电脑端：顶栏直接展示四大体系，悬停/点击出下拉；抽屉与汉堡隐藏 ── */
.rl-inline{display:none}
.rl-panel{
  position:fixed;z-index:9993;min-width:148px;padding:8px;border-radius:20px;
  opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top left;
  transition:opacity .22s,transform .3s var(--rl-ease),visibility 0s .3s;
}
.rl-panel.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.rl-panel a{display:block;padding:10px 16px;border-radius:12px;font-size:14px;letter-spacing:.08em;white-space:nowrap}
.rl-panel a:hover{background:rgba(44,44,44,.06)}
@media (min-width:960px){
  .rl-burger,.rl-drawer,.rl-scrim{display:none!important}
  .rl-brand{position:static;transform:none;flex:1;margin:0;text-align:center;text-indent:.32em}
  .rl-inline{display:flex;align-items:center;gap:2px;margin-left:auto;padding-right:6px}
  .rl-inline>button,.rl-inline>a{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;font-size:14px;letter-spacing:.1em;white-space:nowrap}
  .rl-inline>button:hover,.rl-inline>a:hover,.rl-inline>button[aria-expanded="true"]{background:rgba(44,44,44,.06)}
  .rl-inline .cur{color:var(--rl-gold)}
  .rl-inline .sep{width:1px;height:14px;margin:0 8px;background:rgba(44,44,44,.18)}
}

@media (prefers-reduced-motion:reduce){.rl-nav *{transition:none!important}}
@media print{.rl-nav{display:none!important}}
</style>

<script id="rl-nav-js">
(function(){
  var CFG = {{ site.rl_nav | jsonify }};
  var BASE = {{ site.baseurl | default: "" | jsonify }};
  if(!CFG || !CFG.groups) return;

  var root = document.documentElement;
  var G = CFG.groups, F = CFG.footer || [];
  var LANGS = CFG.languages || [
    {code:'zh-CN',label:'中文'},{code:'en',label:'EN'},{code:'ja',label:'日本語'},{code:'es',label:'ES'}
  ];

  /* ── 工具 ── */
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function norm(p){p=String(p).split('#')[0].replace(/index\.html$/,'').replace(/\/+$/,'');return p||'/';}
  function href(u){return /^(https?:)?\/\//.test(u)?u:BASE+u;}
  var here = norm(location.pathname);
  function isCur(u){return u.indexOf('#')<0 && norm(BASE+u)===here;}
  function hasCur(g){return (g.children||[]).some(function(k){return isCur(k.url);});}
  var isHome = here===norm(BASE+'/');

  /* ── 语言：接本站自研四语切换（localStorage['yc-lang']，取值 zh/en/ja/es；window.ycSetLang 由 custom-head.html 暴露，切语言不刷新页面）。
        本站没有 Google 翻译，绝不写翻译 cookie。 ── */
  window.rlCurrentLang = function(){
    var l='zh';
    try{ l=localStorage.getItem('yc-lang')||'zh'; }catch(e){}
    return {zh:'zh-CN',en:'en',ja:'ja',es:'es'}[l]||'zh-CN';
  };
  window.rlSwitchLang = function(code){
    var m={'zh-CN':'zh',en:'en',ja:'ja',es:'es'};
    var l=m[code]||'zh';
    if(typeof window.ycSetLang==='function'){ window.ycSetLang(l); return; }
    try{ localStorage.setItem('yc-lang',l); }catch(e){}
    location.reload();
  };
  function curLang(){ return window.rlCurrentLang(); }
  function setLang(code){ window.rlSwitchLang(code); }

  /* ── 模板 ── */
  var GLOBE='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5c2.2 2.1 3.3 4.6 3.3 7.5S12.2 15.4 10 17.5M10 2.5C7.8 4.6 6.7 7.1 6.7 10s1.1 5.4 3.3 7.5"/></svg>';
  function link(k){return '<li><a href="'+href(k.url)+'"'+(isCur(k.url)?' aria-current="page"':'')+'>'+esc(k.title)+'</a></li>';}

  function drawerGroup(g){
    var kids=g.children||[], on=hasCur(g), n=g.num?'<span class="rl-n">'+esc(g.num)+'</span>':'';
    if(!kids.length) return '<li class="rl-g"><a href="'+href(g.url)+'">'+n+esc(g.title)+'</a></li>';
    return '<li class="rl-g'+(on?' on':'')+'"><button type="button" aria-expanded="'+on+'">'+n+esc(g.title)+'</button>'
         + '<div class="rl-sub"><ul>'+kids.map(link).join('')+'</ul></div></li>';
  }
  function inlineItem(g,i){
    var kids=g.children||[], c=hasCur(g)?' class="cur"':'';
    if(!kids.length) return '<a href="'+href(g.url)+'"'+c+'>'+esc(g.title)+'</a>';
    return '<button type="button" data-g="'+i+'" aria-haspopup="true" aria-expanded="false"'+c+'>'+esc(g.title)+'</button>';
  }

  function build(){
    var cl=curLang(), cur=LANGS.filter(function(l){return l.code===cl;})[0]||LANGS[0];
    var html=''
    + '<div class="rl-scrim"></div>'
    + '<div class="rl-bar rl-glass">'
    +   '<button type="button" class="rl-lang-btn" aria-haspopup="true" aria-expanded="false" aria-label="Language" translate="no">'+GLOBE+'<span>'+esc(cur.label)+'</span></button>'
    +   '<a class="rl-brand" href="'+href('/')+'">罗文杰炎灿</a>'
    +   '<nav class="rl-inline" aria-label="Primary">'+G.map(inlineItem).join('')+'<span class="sep"></span>'
    +     F.map(function(k){return '<a href="'+href(k.url)+'"'+(isCur(k.url)?' class="cur"':'')+'>'+esc(k.title)+'</a>';}).join('')+'</nav>'
    +   '<button type="button" class="rl-burger" aria-label="Menu" aria-expanded="false" aria-controls="rl-drawer"><i></i><i></i></button>'
    + '</div>'
    + '<div class="rl-pop rl-glass" role="menu" translate="no">'
    +   LANGS.map(function(l){return '<button type="button" role="menuitemradio" aria-checked="'+(l.code===cur.code)+'" data-lang="'+esc(l.code)+'">'+esc(l.label)+'</button>';}).join('')
    + '</div>'
    + '<nav class="rl-drawer rl-glass" id="rl-drawer" aria-label="Menu"><ul>'+G.map(drawerGroup).join('')+'</ul>'
    +   '<div class="rl-hr"></div><div class="rl-foot">'+F.map(function(k){return '<a href="'+href(k.url)+'"'+(isCur(k.url)?' aria-current="page"':'')+'>'+esc(k.title)+'</a>';}).join('')+'</div></nav>'
    + '<div class="rl-panel rl-glass"></div>';
    var el=document.createElement('div');
    el.className='rl-nav'; el.id='rl-nav'; el.innerHTML=html;
    document.body.appendChild(el);
    return el;
  }

  /* ── 交互 ── */
  function wire(el){
    var $=function(s){return el.querySelector(s);}, $$=function(s){return [].slice.call(el.querySelectorAll(s));};
    var langBtn=$('.rl-lang-btn'), pop=$('.rl-pop'), burger=$('.rl-burger'), panel=$('.rl-panel'), bar=$('.rl-bar');

    function closePanel(){
      panel.classList.remove('on');
      $$('.rl-inline [data-g]').forEach(function(b){b.setAttribute('aria-expanded','false');});
    }
    function closeAll(){
      el.classList.remove('rl-open'); burger.setAttribute('aria-expanded','false');
      pop.classList.remove('on'); langBtn.setAttribute('aria-expanded','false');
      closePanel();
    }

    langBtn.addEventListener('click',function(e){
      e.stopPropagation(); var on=!pop.classList.contains('on'); closeAll();
      if(on){pop.classList.add('on'); langBtn.setAttribute('aria-expanded','true');}
    });
    function syncLangUI(code){
      var cur=LANGS.filter(function(l){return l.code===code;})[0]||LANGS[0];
      $$('.rl-pop [data-lang]').forEach(function(b){b.setAttribute('aria-checked',b.getAttribute('data-lang')===cur.code?'true':'false');});
      var sp=langBtn.querySelector('span'); if(sp) sp.textContent=cur.label;
    }
    pop.addEventListener('click',function(e){
      var b=e.target.closest('[data-lang]'); if(!b) return;
      var code=b.getAttribute('data-lang');
      setLang(code);
      syncLangUI(code);
      closeAll();
    });
    // 站内其他入口切了语言时（如旧语言下拉），面板选中态也要跟上
    if(window.MutationObserver){
      new MutationObserver(function(){ syncLangUI(curLang()); }).observe(root,{attributes:true,attributeFilter:['data-yc-lang']});
    }
    burger.addEventListener('click',function(e){
      e.stopPropagation(); var on=!el.classList.contains('rl-open'); closeAll();
      if(on){el.classList.add('rl-open'); burger.setAttribute('aria-expanded','true');}
    });
    $('.rl-scrim').addEventListener('click',closeAll);
    document.addEventListener('click',function(e){if(!el.contains(e.target)) closeAll();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape') closeAll();});
    el.addEventListener('click',function(e){if(e.target.closest('a')) closeAll();});   // 同页锚点（如 /#fragrance）点击后也收起

    // 手风琴：同一时间只展开一组
    $$('.rl-g>button').forEach(function(b){
      b.addEventListener('click',function(){
        var li=b.parentNode, open=!li.classList.contains('on');
        $$('.rl-g.on').forEach(function(x){x.classList.remove('on'); x.firstChild.setAttribute('aria-expanded','false');});
        if(open){li.classList.add('on'); b.setAttribute('aria-expanded','true');}
      });
    });

    // 电脑端下拉
    var timer;
    function openPanel(b){
      var g=G[+b.getAttribute('data-g')], r=b.getBoundingClientRect(), br=bar.getBoundingClientRect();
      pop.classList.remove('on'); langBtn.setAttribute('aria-expanded','false');
      closePanel();
      panel.innerHTML=(g.children||[]).map(function(k){return '<a href="'+href(k.url)+'"'+(isCur(k.url)?' aria-current="page"':'')+'>'+esc(k.title)+'</a>';}).join('');
      panel.style.left=Math.max(12,r.left)+'px';
      panel.style.top=(br.bottom+8)+'px';
      panel.classList.add('on'); b.setAttribute('aria-expanded','true');
    }
    $$('.rl-inline [data-g]').forEach(function(b){
      b.addEventListener('mouseenter',function(){if(window.matchMedia('(hover:hover)').matches) openPanel(b);});
      b.addEventListener('click',function(e){
        e.stopPropagation();
        if(b.getAttribute('aria-expanded')==='true') closePanel(); else openPanel(b);
      });
    });
    [$('.rl-inline'),panel].forEach(function(n){
      n.addEventListener('mouseenter',function(){clearTimeout(timer);});
      n.addEventListener('mouseleave',function(){timer=setTimeout(closePanel,160);});
    });

    // 滚动：加强玻璃底色（品牌常显，不再随滚动淡入淡出）
    var ticking=false;
    function onScroll(){
      var y=window.pageYOffset||0;
      root.classList.toggle('rl-scrolled',y>8);
    }
    window.addEventListener('scroll',function(){
      if(ticking) return; ticking=true;
      requestAnimationFrame(function(){ticking=false; onScroll();});
    },{passive:true});
    onScroll();
  }

  function init(){
    try{
      var el=build();
      root.classList.add('rl-on');
      if(isHome) root.classList.add('rl-home');
      wire(el);
    }catch(err){
      root.classList.remove('rl-on','rl-home');
      var old=document.getElementById('rl-nav'); if(old) old.remove();
      if(window.console) console.warn('[rl-nav] fallback to default header:',err);
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
