</script>

<!-- 2026-11-27 Gemini Canvas 升级（第 3 步）：Tocbot 悬浮目录，仅在 /books/*/read/ 试读页动态加载并初始化 -->
<style>
  #yc-toc { display: none; }
  @media (min-width: 1100px) {
    #yc-toc {
      display: block; position: fixed; right: 24px; top: 120px; width: 220px;
      max-height: 70vh; overflow: auto; font-size: 13px; line-height: 1.7;
      border-left: 2px solid #C5A059; padding-left: 14px;
    }
    #yc-toc .toc-list { list-style: none; padding-left: 0; margin: 0; }
    #yc-toc .toc-list .toc-list { padding-left: 12px; }
    #yc-toc .toc-link { color: #8a8578; text-decoration: none; }
    #yc-toc .is-active-link { color: #2C2C2C; font-weight: 600; }
  }
</style>
<script>
  (function() {
    if (!/\/books\/[^/]+\/read\//.test(window.location.pathname)) return;
    function loadCss(href) {
      var l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = href;
      document.head.appendChild(l);
    }
    function loadJs(src, cb) {
      var s = document.createElement('script');
      s.src = src; s.onload = cb;
      document.head.appendChild(s);
    }
    function initToc() {
      if (!window.tocbot) return;
      var page = document.querySelector('.read-page');
      if (!page) return;
      var toc = document.createElement('nav');
      toc.id = 'yc-toc';
      toc.setAttribute('aria-label', '本页目录');
      page.parentNode.insertBefore(toc, page);
      tocbot.init({
        tocSelector: '#yc-toc',
        contentSelector: '.read-page',
        headingSelector: 'h2, h3, h4',
        hasInnerContainers: true
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      loadCss('https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.css');
      loadJs('https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.min.js', initToc);
    });
  })();
</script>

<!-- 2026-11-27 Dior 式滚动动效：区块进入视口时淡入 + 轻微上移（原生 IntersectionObserver，无动画库、无插件） -->
<style>
  .yc-reveal { opacity: 0; transform: translateY(16px); transition: opacity .7s ease-out, transform .7s ease-out; will-change: opacity, transform; }
  .yc-reveal.yc-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .yc-reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (!("IntersectionObserver" in window)) return;
    var targets = document.querySelectorAll(".hero-full, .manifesto, .home-sec, .sys-card, .work-card, .book-card, .tl-item, .prod, .biz-card, .home-foot, .books-grid, .books-list li, .book-covers figure, .book-detail h1, .book-detail h2, .book-desc, .book-meta, .bio-page h2, .bio-page p");
    var io = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) { e.target.classList.add("yc-visible"); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
    targets.forEach(function(el) { el.classList.add("yc-reveal"); io.observe(el); });
  });
</script>
