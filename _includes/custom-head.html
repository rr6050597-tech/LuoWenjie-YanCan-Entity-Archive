  var HTML_KEYS={"home-manifesto":1,"sys-3-desc":1};
  function ycGetLang(){try{return localStorage.getItem('yc-lang')||'zh';}catch(e){return 'zh';}}
  function ycApplyLang(lang){
    document.documentElement.setAttribute('data-yc-lang',lang);
    document.documentElement.lang=lang==='zh'?'zh-CN':lang;
    var els=document.querySelectorAll('[data-i18n]');
    for(var i=0;i<els.length;i++){
      var k=els[i].getAttribute('data-i18n');
      var v=DICT[k]&&DICT[k][lang];
      if(v==null)continue;
      if(HTML_KEYS[k]){els[i].innerHTML=v;}else{els[i].textContent=v;}
    }
    var phs=document.querySelectorAll('[data-i18n-ph]');
    for(var j=0;j<phs.length;j++){
      var k2=phs[j].getAttribute('data-i18n-ph');
      var v2=DICT[k2]&&DICT[k2][lang];
      if(v2!=null)phs[j].setAttribute('placeholder',v2);
    }
    var btns=document.querySelectorAll('[data-yc-lang-btn]');
    for(var b=0;b<btns.length;b++){btns[b].setAttribute('aria-pressed',btns[b].getAttribute('data-yc-lang-btn')===lang?'true':'false');}
    try{localStorage.setItem('yc-lang',lang);}catch(e){}
  }
  function ycSetLang(lang){if(LANGS.indexOf(lang)<0)return;ycApplyLang(lang);}
  window.ycSetLang=ycSetLang;
  function ycBuildSwitcher(extraCls){
    var wrap=document.createElement('div');
    wrap.className='yc-lang-switch'+(extraCls?' '+extraCls:'');
    wrap.setAttribute('role','group');
    wrap.setAttribute('aria-label','Language / 语言 / 言語');
    LANGS.forEach(function(l){
      var btn=document.createElement('button');
      btn.type='button';
      btn.setAttribute('data-yc-lang-btn',l);
      btn.setAttribute('aria-pressed','false');
      btn.textContent=LABELS[l];
      btn.addEventListener('click',function(){ycSetLang(l);});
      wrap.appendChild(btn);
    });
    return wrap;
  }
  document.addEventListener('DOMContentLoaded',function(){
    var toggle=document.querySelector('.theme-toggle');
    if(toggle&&toggle.parentNode){toggle.parentNode.insertBefore(ycBuildSwitcher(),toggle);}
    var btn=document.createElement('button');
    btn.className='yc-menu-btn';
    btn.type='button';
    btn.setAttribute('aria-label','目录 Menu');
    var btnLabel=document.createElement('span');
    btnLabel.setAttribute('data-i18n','nav-menu');
    btnLabel.textContent='目录';
    btn.appendChild(btnLabel);
    var backdrop=document.createElement('div');
    backdrop.className='yc-menu-backdrop';
    var panel=document.createElement('nav');
    panel.className='yc-menu-panel';
    panel.setAttribute('aria-label','目录');
    var closeRow=document.createElement('div');
    closeRow.className='yc-menu-close';
    var closeBtn=document.createElement('button');
    closeBtn.type='button';
    closeBtn.setAttribute('aria-label','关闭 Close');
    closeBtn.textContent='×';
    closeRow.appendChild(closeBtn);
    panel.appendChild(closeRow);
    panel.appendChild(ycBuildSwitcher('yc-lang-panel'));
    var items=[['/','nav-home'],['/books/','nav-books'],['/works/film/','nav-film'],['/works/magazine/','nav-magazine'],['/bio/','nav-bio'],['/faq/','nav-faq'],['/#fragrance','nav-fragrance']];
    items.forEach(function(it){
      var a=document.createElement('a');
      a.className='yc-menu-item';
      a.href=it[0];
      var sp=document.createElement('span');
      sp.setAttribute('data-i18n',it[1]);
      a.appendChild(sp);
      a.addEventListener('click',function(){closeMenu();});
      panel.appendChild(a);
    });
    function openMenu(){panel.classList.add('open');backdrop.classList.add('open');document.body.style.overflow='hidden';}
    function closeMenu(){panel.classList.remove('open');backdrop.classList.remove('open');document.body.style.overflow='';}
    btn.addEventListener('click',function(){if(panel.classList.contains('open')){closeMenu();}else{openMenu();}});
    closeBtn.addEventListener('click',closeMenu);
    backdrop.addEventListener('click',closeMenu);
    document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu();});
    document.body.appendChild(btn);
    document.body.appendChild(backdrop);
    document.body.appendChild(panel);
    ycApplyLang(ycGetLang());
  });
})();
</script>
